spring.application.name=quizapp
# ----------------------------------------
# POSTGRESQL DATABASE CONFIGURATION
# ----------------------------------------
# Replace 'quizdb' with your database name
# Replace 'postgres' and 'password' with your PostgreSQL username and password
spring.datasource.url=jdbc:postgresql://localhost:5432/quizdb
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------
# JPA/HIBERNATE CONFIGURATION
# ----------------------------------------
# 'update' automatically creates/updates the database schema based on your entities.
# Use 'validate' in production.
spring.jpa.hibernate.ddl-auto=create

# Show SQL statements in the console for debugging
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ----------------------------------------
# THYMELEAF CONFIGURATION
# ----------------------------------------
# Disable Thymeleaf caching for easier development (re-enable in production)
spring.thymeleaf.cache=false


# Disables the Open in View warning and improves performance
spring.jpa.open-in-view=false