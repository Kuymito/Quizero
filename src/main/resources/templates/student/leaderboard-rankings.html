<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Rankings', ~{::main}, 'student-leaderboard')}">
<head>
  <title>Rankings</title>
</head>
<body>
<main>
  <div class="flex items-center mb-6">
    <a th:href="@{/student/leaderboard}" class="mr-4 p-2 bg-white rounded-full text-gray-500 hover:text-gray-800 shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </a>
    <div>
      <h1 class="text-3xl font-bold text-gray-800" th:text="${quiz.title} + ' - Top 10'">Rankings</h1>
      <p class="text-gray-500" th:text="${quiz.subject}">Subject</p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Rank</th>
        <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Student</th>
        <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Score</th>
        <th class="px-6 py-4 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Date</th>
      </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
      <tr th:each="attempt, iterStat : ${topAttempts}"
          th:classappend="${iterStat.index == 0} ? 'bg-yellow-50' : ''">

        <td class="px-6 py-4 whitespace-nowrap">
          <div th:switch="${iterStat.count}">
            <span th:case="1" class="text-2xl">🥇</span>
            <span th:case="2" class="text-2xl">🥈</span>
            <span th:case="3" class="text-2xl">🥉</span>
            <span th:case="*" class="text-gray-500 font-bold text-lg ml-2" th:text="${iterStat.count}">4</span>
          </div>
        </td>

        <td class="px-6 py-4 whitespace-nowrap">
          <div class="flex items-center">
            <div class="h-10 w-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 font-bold mr-3"
                 th:text="${#strings.substring(attempt.student.fullName, 0, 1)}">A</div>
            <div class="text-sm font-medium text-gray-900" th:text="${attempt.student.fullName}">Name</div>
          </div>
        </td>

        <td class="px-6 py-4 whitespace-nowrap">
                    <span class="px-3 py-1 inline-flex text-sm leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                        <span th:text="${attempt.score} + '/' + ${attempt.totalQuestions}">10/10</span>
                    </span>
        </td>

        <td class="px-6 py-4 whitespace-nowrap text-right text-sm text-gray-500"
            th:text="${#temporals.format(attempt.attemptedAt, 'MMM dd, yyyy')}">
          Date
        </td>
      </tr>

      <tr th:if="${topAttempts.isEmpty()}">
        <td colspan="4" class="px-6 py-10 text-center text-gray-500">
          No attempts recorded for this quiz yet. Be the first!
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
