<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Class Details', ~{::main}, 'student-dashboard')}">
<head><title>Class Quizzes</title></head>
<body>
<main>
  <div class="mb-6 flex items-center">
    <a th:href="@{/student/dashboard}" class="mr-4 p-2 bg-white rounded-full text-gray-500 hover:text-gray-800 shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
      </svg>
    </a>
    <div>
      <h1 class="text-3xl font-bold text-gray-800" th:text="${classroom.name}">Class Name</h1>
      <p class="text-gray-500" th:text="'Teacher: ' + ${classroom.teacher.fullName}">Teacher Name</p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 font-semibold text-gray-700 flex justify-between items-center">
      <span>Available Quizzes</span>
      <span class="bg-purple-100 text-purple-700 text-xs font-bold px-2 py-1 rounded-full" th:text="${classroom.quizzes.size()} + ' Quizzes'">0 Quizzes</span>
    </div>

    <div th:if="${classroom.quizzes.isEmpty()}" class="p-8 text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-gray-100 text-gray-400 mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
      </div>
      <p class="text-gray-500">No quizzes have been added to this class yet.</p>
    </div>

    <div th:unless="${classroom.quizzes.isEmpty()}" class="divide-y divide-gray-100">
      <div th:each="quiz : ${classroom.quizzes}" class="p-6 flex justify-between items-center hover:bg-gray-50 transition-colors">
        <div>
          <h3 class="text-lg font-medium text-gray-900" th:text="${quiz.title}">Quiz Title</h3>
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 mt-1" th:text="${quiz.subject}">
                        Subject
                    </span>
        </div>
        <a th:href="@{/student/quiz/{id}(id=${quiz.id})}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
          Take Quiz
          <svg xmlns="http://www.w3.org/2000/svg" class="ml-2 -mr-1 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
