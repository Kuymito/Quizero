<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Class Details', ~{::main}, 'student-dashboard')}">
<head><title>Class Quizzes</title></head>
<body>
<main>
    <div class="mb-6 flex items-center">
        <a th:href="@{/student/dashboard}" class="mr-4 p-2 bg-white rounded-full text-gray-500 hover:text-gray-800 shadow-sm border border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
        </a>
        <div>
            <h1 class="text-3xl font-bold text-gray-800" th:text="${classroom.name}">Class Name</h1>
            <p class="text-gray-500" th:text="'Teacher: ' + ${classroom.teacher.fullName}">Teacher Name</p>
        </div>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6">
        <form th:action="@{/student/class/{id}(id=${classroom.id})}" method="get" id="filterForm" class="flex flex-col md:flex-row gap-4 items-center">

            <div class="relative flex-1 w-full">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                    </svg>
                </div>
                <input type="text" name="search" th:value="${search}" placeholder="Search quizzes..."
                       class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors">
            </div>

            <label class="flex items-center cursor-pointer select-none">
                <div class="relative">
                    <input type="checkbox" name="showAll" value="true" class="sr-only"
                           onchange="document.getElementById('filterForm').submit()"
                           th:checked="${showAll}">
                    <div class="block w-10 h-6 rounded-full"
                         th:classappend="${showAll} ? 'bg-indigo-600' : 'bg-gray-300'"></div>
                    <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition transform duration-200 ease-in-out"
                         th:classappend="${showAll} ? 'translate-x-4' : ''"></div>
                </div>
                <div class="ml-3 text-gray-700 font-medium text-sm">Include Closed</div>
            </label>

            <button type="submit" class="bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 px-6 rounded-lg transition-colors shadow-sm">
                Search
            </button>

            <a th:if="${(search != null and !search.isEmpty()) or showAll}"
               th:href="@{/student/class/{id}(id=${classroom.id})}"
               class="text-gray-500 hover:text-gray-700 font-medium text-sm">
                Reset
            </a>
        </form>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 font-semibold text-gray-700 flex justify-between items-center">
            <span>Available Quizzes</span>
            <span class="bg-purple-100 text-purple-700 text-xs font-bold px-2 py-1 rounded-full" th:text="${quizzes.size()} + ' Found'">0 Found</span>
        </div>

        <div th:if="${quizzes.isEmpty()}" class="p-8 text-center">
            <p class="text-gray-500">No quizzes match your search.</p>
        </div>

        <div th:unless="${quizzes.isEmpty()}" class="divide-y divide-gray-100">
            <div th:each="quiz : ${quizzes}" class="p-6 flex flex-col sm:flex-row sm:justify-between sm:items-center hover:bg-gray-50 transition-colors gap-4">
                <div>
                    <div class="flex items-center gap-3">
                        <h3 class="text-lg font-medium text-gray-900" th:text="${quiz.title}">Quiz Title</h3>

                        <span th:if="${attemptedQuizIds != null and attemptedQuizIds.contains(quiz.id)}"
                              class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-green-100 text-green-800 border border-green-200">
                            Done
                        </span>
                    </div>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800" th:text="${quiz.subject}">Subject</span>

                        <span th:unless="${quiz.published}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600 border border-gray-200">
                            Closed
                        </span>
                    </div>
                </div>

                <div class="flex-shrink-0">
                    <a th:if="${quiz.published}"
                       th:href="@{/student/quiz/{id}(id=${quiz.id})}"
                       class="inline-flex items-center justify-center px-4 py-2 border text-sm font-medium rounded-md shadow-sm transition-colors min-w-[140px]"
                       th:classappend="${attemptedQuizIds != null and attemptedQuizIds.contains(quiz.id)} ? 'border-gray-300 text-gray-700 bg-white hover:bg-gray-50' : 'bg-green-600 text-white hover:bg-green-700'">
                        <span th:text="${attemptedQuizIds != null and attemptedQuizIds.contains(quiz.id)} ? 'Retake Quiz' : 'Start Quiz'">Start</span>
                    </a>

                    <button th:unless="${quiz.published}" disabled
                            class="inline-flex items-center justify-center px-4 py-2 border border-gray-200 text-sm font-medium rounded-md text-gray-400 bg-gray-50 cursor-not-allowed min-w-[140px]">
                        Locked
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
