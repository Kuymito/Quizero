<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Student Dashboard', ~{::main}, 'student-dashboard')}">
<head><title>Dashboard</title></head>
<body>
<main>
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">My Classes</h1>
        <a th:href="@{/student/join}" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg">
            Join a Class
        </a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div th:each="cls : ${classes}" class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 hover:shadow-md transition">
            <h2 class="text-xl font-bold text-gray-800 mb-2" th:text="${cls.name}">Class Name</h2>
            <p class="text-gray-500 mb-4" th:text="'Teacher: ' + ${cls.teacher.fullName}">Teacher</p>
            <a th:href="@{/student/class/{id}(id=${cls.id})}" class="block w-full text-center bg-purple-50 text-purple-700 font-semibold py-2 rounded-lg hover:bg-purple-100">
                View Quizzes
            </a>
        </div>
    </div>
</main>
</body>
</html>
