<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Join Class', ~{::main}, 'student-dashboard')}">
<head><title>Join Class</title></head>
<body>
<main class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg mt-10">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Join a Class</h1>
    <form th:action="@{/student/join}" method="post">
        <div class="mb-6">
            <label class="block text-gray-700 font-bold mb-2">Enter Class Code</label>
            <input type="text" name="code" required class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-center text-lg tracking-widest uppercase" placeholder="e.g. ABC12">
        </div>
        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg">
            Join Class
        </button>
    </form>
</main>
</body>
</html>
