<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('My Performance', ~{::main}, 'student-performance')}">
<head>
    <title>My Performance</title>
</head>
<body>
<main>
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Performance Summary</h1>

    <div th:if="${attempts.isEmpty()}" class="text-center p-10 bg-white rounded-xl shadow-lg border border-gray-200">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-purple-100 text-purple-600 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
        </div>
        <h2 class="text-xl font-semibold text-gray-800">No quizzes taken yet</h2>
        <p class="text-gray-600 mt-2 mb-6">Start taking quizzes to see your analytics here!</p>
        <a th:href="@{/student/quizzes}" class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors">
            Take Your First Quiz
        </a>
    </div>

    <div th:unless="${attempts.isEmpty()}" class="space-y-8">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6"
             th:with="totalScore=${#aggregates.sum(attempts.![score])},
                      totalMax=${#aggregates.sum(attempts.![totalQuestions])}">

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 lg:col-span-1">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Overall Accuracy</h3>
                <div class="relative h-64 w-full flex justify-center">
                    <canvas id="performanceChart"
                            th:data-correct="${totalScore}"
                            th:data-total="${totalMax > 0 ? totalMax : 1}"></canvas>
                </div>
            </div>

            <div class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-center items-center text-center">
                    <div class="p-3 bg-blue-100 text-blue-600 rounded-full mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                    </div>
                    <div class="text-4xl font-bold text-gray-800" th:text="${attempts.size()}">0</div>
                    <div class="text-sm text-gray-500 font-medium uppercase tracking-wide mt-1">Quizzes Completed</div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-center items-center text-center">
                    <div class="p-3 bg-green-100 text-green-600 rounded-full mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                        </svg>
                    </div>
                    <div class="text-4xl font-bold text-gray-800"
                         th:text="${totalMax > 0 ? #numbers.formatDecimal((totalScore * 100.0) / totalMax, 1, 1) : 0} + '%'">
                        0%
                    </div>
                    <div class="text-sm text-gray-500 font-medium uppercase tracking-wide mt-1">Average Score</div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-800">Recent History</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quiz Title</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Score</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="attempt : ${attempts}" class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-gray-900" th:text="${attempt.quiz.title}">Quiz Title</div>
                            <div class="text-xs text-gray-500" th:text="${attempt.quiz.subject}">Subject</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full"
                                  th:classappend="${(attempt.score * 100.0 / attempt.totalQuestions) >= 50} ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                                <span th:text="${#numbers.formatDecimal((attempt.score * 100.0) / attempt.totalQuestions, 1, 1)} + '%'">80.0%</span>
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                            th:text="${#temporals.format(attempt.attemptedAt, 'MMM dd, yyyy • HH:mm')}">
                            Date
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-3">
                            <a th:href="@{/student/quiz/{id}(id=${attempt.quiz.id})}" class="text-blue-600 hover:text-blue-900 font-medium hover:underline">
                                Retake
                            </a>
                            <a th:href="@{/student/attempt/{id}(id=${attempt.id})}" class="text-purple-600 hover:text-purple-900 font-medium hover:underline">
                                Review
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const ctxCanvas = document.getElementById('performanceChart');
            if (!ctxCanvas) return;

            const totalCorrect = parseInt(ctxCanvas.dataset.correct || 0);
            const totalMax = parseInt(ctxCanvas.dataset.total || 0);
            const totalIncorrect = totalMax - totalCorrect;

            if (totalMax === 0) return;

            new Chart(ctxCanvas, {
                type: 'doughnut',
                data: {
                    labels: ['Correct', 'Incorrect'],
                    datasets: [{
                        data: [totalCorrect, totalIncorrect],
                        backgroundColor: [
                            '#10B981', // Green
                            '#EF4444'  // Red
                        ],
                        hoverBackgroundColor: [
                            '#059669',
                            '#DC2626'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: {
                                    family: "'Inter', sans-serif",
                                    size: 12
                                },
                                usePointStyle: true,
                                padding: 20
                            }
                        }
                    },
                    cutout: '70%'
                }
            });
        });
    </script>
</main>
</body>
</html>
