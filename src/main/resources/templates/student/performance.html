<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'student-performance')}">
<head>
    <title>My Performance</title>
</head>
<body>
<main>
    <h1 class="text-3xl font-bold text-gray-800 mb-6">My Performance</h1>

    <div th:if="${attempts.isEmpty()}" class="text-center p-6 bg-white rounded-lg shadow-lg">
        <p class="text-gray-600">You have not attempted any quizzes yet.</p>
        <a th:href="@{/student/quizzes}" class="inline-block mt-4 bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg">Take a Quiz</a>
    </div>

    <div th:unless="${attempts.isEmpty()}" class="bg-white rounded-xl shadow-lg overflow-x-auto border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quiz Title</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Score</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Percentage</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Attempted On</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="attempt : ${attempts}">
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${attempt.quiz.title}">Java Basics</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">
                    <span th:text="${attempt.score}">8</span> /
                    <span th:text="${attempt.totalQuestions}">10</span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">
                    <span th:text="${#numbers.formatDecimal( (attempt.score * 100.0) / attempt.totalQuestions, 1, 1)} + '%'">80.0%</span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(attempt.attemptedAt, 'MMM dd, yyyy - hh:mm a')}">Oct 26, 2024 - 02:30 PM</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                    <a th:href="@{/student/attempt/{id}(id=${attempt.id})}" class="text-purple-600 hover:text-purple-900">View Details</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
