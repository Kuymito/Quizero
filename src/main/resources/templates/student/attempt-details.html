<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Quiz Review', ~{::main}, 'student-performance')}">
<head>
  <title th:text="'Reviewing: ' + ${attempt.quiz.title}">Quiz Review</title>
</head>
<body>
<main class="max-w-3xl mx-auto">
  <h1 class="text-3xl font-bold text-gray-800" th:text="${attempt.quiz.title}">Quiz Title</h1>
  <p class="text-lg text-gray-600 mb-6" th:text="${attempt.quiz.subject}">Quiz Subject</p>

  <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Your Result</h2>
    <div class="grid grid-cols-3 gap-4 text-center">
      <div>
        <div class="text-sm text-gray-500">Score</div>
        <div class="text-2xl font-bold text-purple-700">
          <span th:text="${attempt.score}">8</span> /
          <span th:text="${attempt.totalQuestions}">10</span>
        </div>
      </div>
      <div>
        <div class="text-sm text-gray-500">Percentage</div>
        <div class="text-2xl font-bold text-purple-700">
          <span th:text="${#numbers.formatDecimal( (attempt.score * 100.0) / attempt.totalQuestions, 1, 1)} + '%'">80.0%</span>
        </div>
      </div>
      <div>
        <div class="text-sm text-gray-500">Attempted On</div>
        <div class="text-lg font-medium text-gray-700" th:text="${#temporals.format(attempt.attemptedAt, 'MMM dd, yyyy')}">Oct 26, 2024</div>
      </div>
    </div>
  </div>

  <div class="space-y-8">
    <div th:each="question, qStat : ${attempt.quiz.questions}" class="bg-white p-6 rounded-lg shadow-lg border border-gray-200">

      <th:block th:with="studentAnswer=${studentAnswerMap[question.id]}">
        <th:block th:with="selectedOptionId=${studentAnswer != null ? studentAnswer.selectedOption.id : null}">

          <p class="text-lg font-semibold text-gray-900 mb-4">
            <span th:text="${qStat.count} + '. '">1. </span>
            <span th:text="${question.text}">Question text goes here?</span>
          </p>

          <div th:if="${question.image != null and question.image.length > 0}" class="mb-4">
            <img th:src="@{/image/question/{id}(id=${question.id})}" class="max-h-64 w-auto rounded-lg border border-gray-200">
          </div>

          <div class="space-y-3">
            <div th:each="option : ${question.options}"
                 class="flex items-center p-3 rounded-lg border"
                 th:classappend="(${option.correct} ? 'bg-green-50 border-green-300' : '') + ' ' + (${selectedOptionId == option.id and !option.correct} ? 'bg-red-50 border-red-300' : '')">

                        <span th:if="${option.correct}" class="flex-shrink-0 w-5 h-5 text-green-600">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" /></svg>
                        </span>
              <span th:if="${selectedOptionId == option.id && !option.correct}" class="flex-shrink-0 w-5 h-5 text-red-600">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" /></svg>
                        </span>
              <span th:if="${selectedOptionId != option.id && !option.correct}" class="flex-shrink-0 w-5 h-5 text-gray-400">
                             <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM7 9H5v2h2V9zm8 0h-2v2h2V9z" clip-rule="evenodd" /></svg>
                        </span>

              <label class="ml-3 block text-sm font-medium text-gray-700" th:text="${option.text}">
                Option text
              </label>
              <span th:if="${selectedOptionId == option.id}" class="ml-auto text-xs font-medium text-gray-500">(Your Answer)</span>
            </div>
          </div>

        </th:block>
      </th:block>
    </div>
  </div>
</main>
</body>
</html>
