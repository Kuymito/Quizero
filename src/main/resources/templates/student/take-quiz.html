<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'student-take-quiz')}">
<head>
    <title th:text="'Taking Quiz: ' + ${quiz.title}">Take Quiz</title>
</head>
<body>
<main class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800" th:text="${quiz.title}">Quiz Title</h1>
    <p class="text-lg text-gray-600 mb-6" th:text="${quiz.subject}">Quiz Subject</p>

    <form th:action="@{/student/quiz/submit}" method="post" class="bg-white p-8 rounded-xl shadow-lg">
        <input type="hidden" name="quizId" th:value="${quiz.id}" />

        <div class="space-y-8">
            <div th:each="question, qStat : ${quiz.questions}" class="p-6 bg-white rounded-lg border border-gray-200">
                <p class="text-lg font-semibold text-gray-900 mb-4">
                    <span th:text="${qStat.count} + '. '">1. </span>
                    <span th:text="${question.text}">Question text goes here?</span>
                </p>

                <div class="space-y-3">
                    <div th:each="option : ${question.options}" class="flex items-center">
                        <input type="radio"
                               th:id="'option-' + ${option.id}"
                               th:name="'question-' + ${question.id}"
                               th:value="${option.id}"
                               required
                               class="form-radio h-5 w-5 text-purple-600 focus:ring-purple-500">
                        <label th:for="'option-' + ${option.id}" class="ml-3 block text-sm font-medium text-gray-700" th:text="${option.text}">
                            Option text
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg text-lg">
                Submit Quiz
            </button>
        </div>
    </form>
</main>
</body>
</html>
