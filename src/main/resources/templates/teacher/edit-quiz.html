<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Edit Quiz', ~{::main}, 'teacher-dashboard')}">
<head><title>Edit Quiz</title></head>
<body>
<main>
    <div class="flex items-center mb-6">
        <a th:href="@{/teacher/class/{id}(id=${quiz.classroom.id})}" class="mr-4 p-2 bg-white rounded-full text-gray-500 hover:text-gray-800 shadow-sm border border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
        </a>
        <h1 class="text-3xl font-bold text-gray-800">Edit Quiz</h1>
    </div>

    <form th:action="@{/teacher/quiz/update/{id}(id=${quiz.id})}" method="post" enctype="multipart/form-data" class="space-y-8 max-w-4xl mx-auto">

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <label class="block text-sm font-medium text-gray-700 mb-1">Quiz Title</label>
            <input type="text" name="quizTitle" th:value="${quiz.title}" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>

        <div th:each="question, qStat : ${quiz.questions}" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-800" th:text="'Question ' + ${qStat.count}">Question 1</h3>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Question Text</label>
                <textarea th:name="'question_' + ${question.id}" rows="2" required
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                          th:text="${question.text}"></textarea>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Update Image (Optional)</label>
                <div class="flex items-center gap-4">
                    <img th:if="${question.image != null}" th:src="@{/image/question/{id}(id=${question.id})}" class="h-20 w-20 object-cover rounded-lg border border-gray-200">
                    <input type="file" th:name="'question_' + ${question.id} + '_image'" accept="image/*"
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>
            </div>

            <div class="space-y-3">
                <p class="text-sm font-medium text-gray-700">Options (Check all that are correct)</p>
                <div th:each="option, oStat : ${question.options}" class="flex items-center gap-3">
                    <input type="checkbox"
                           th:name="'correct_option_' + ${option.id}"
                           th:checked="${option.correct}"
                           class="h-5 w-5 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded cursor-pointer">

                    <input type="text" th:name="'option_' + ${option.id}" th:value="${option.text}" required
                           class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                </div>
            </div>
        </div>

        <div class="sticky bottom-4 bg-white p-4 rounded-xl shadow-lg border border-gray-200 flex justify-end gap-4">
            <a th:href="@{/teacher/class/{id}(id=${quiz.classroom.id})}" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition-colors">Cancel</a>
            <button type="submit" class="px-8 py-2 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow-sm transition-colors">
                Save Changes
            </button>
        </div>
    </form>
</main>
</body>
</html>
