<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Edit Quiz', ~{::main}, 'teacher-dashboard')}">
<head><title>Edit Quiz</title></head>
<body>
<main>
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Edit Quiz</h1>
    </div>

    <form th:action="@{/teacher/quiz/update/{id}(id=${quiz.id})}" method="post" enctype="multipart/form-data" class="space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-200">

        <div class="p-6 bg-gray-50 rounded-lg border border-gray-200">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Quiz Details</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Quiz Title</label>
                    <input type="text" name="quizTitle" th:value="${quiz.title}" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Subject</label>
                    <input type="text" name="quizSubject" th:value="${quiz.subject}" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm">
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <h2 class="text-xl font-semibold text-gray-700 border-b pb-2">Existing Questions</h2>

            <div th:each="question, qStat : ${quiz.questions}" class="p-6 bg-white rounded-lg border border-gray-300 shadow-sm relative">
                <span class="absolute top-4 right-4 text-xs font-bold text-gray-400">EXISTING</span>

                <h3 class="text-lg font-semibold text-gray-800 mb-4" th:text="'Question ' + ${qStat.count}"></h3>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Question Text</label>
                    <textarea th:name="'question_' + ${question.id}" rows="2" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md" th:text="${question.text}"></textarea>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Image</label>
                    <div class="mb-2">
                        <img th:id="'preview-' + ${question.id}"
                             th:src="${question.image != null and question.image.length > 0} ? @{/image/question/{id}(id=${question.id})} : ''"
                             th:class="${question.image != null and question.image.length > 0} ? 'h-32 w-auto rounded border border-gray-200 object-cover' : 'hidden h-32 w-auto rounded border border-gray-200 object-cover'">
                    </div>
                    <input type="file"
                           th:name="'question_' + ${question.id} + '_image'"
                           accept="image/*"
                           th:onchange="'previewEditImage(this, \'preview-' + ${question.id} + '\')'"
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <div class="space-y-3">
                    <label class="block text-sm font-medium text-gray-700">Options</label>
                    <div th:each="option : ${question.options}" class="flex items-center space-x-3">
                        <input type="radio" th:name="'correct_option_' + ${question.id}" th:value="${option.id}" th:checked="${option.correct}" class="form-radio h-5 w-5 text-blue-600">
                        <input type="text" th:name="'option_' + ${option.id}" th:value="${option.text}" required class="block w-full px-3 py-2 border border-gray-300 rounded-md">
                    </div>
                </div>
            </div>
        </div>

        <div id="newQuestionsContainer" class="space-y-6 pt-6 border-t border-gray-200">
            <h2 class="text-xl font-semibold text-gray-700">Add New Questions</h2>
        </div>

        <div class="flex justify-between items-center pt-6">
            <button type="button" id="addQuestionBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors shadow-sm">
                + Add New Question
            </button>
            <div class="space-x-4">
                <a th:href="@{/teacher/class/{id}(id=${quiz.classroom.id})}" class="text-gray-600 hover:text-gray-800 font-medium">Cancel</a>
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg text-lg shadow-md">Update Quiz</button>
            </div>
        </div>
    </form>

    <script>
        // Existing Image Previewer
        function previewEditImage(input, imgId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById(imgId);
                    if (img) {
                        img.src = e.target.result;
                        img.classList.remove('hidden');
                    }
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- NEW QUESTION LOGIC (Same as Create Page) ---
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('newQuestionsContainer');
            const btn = document.getElementById('addQuestionBtn');
            let newQuestionCounter = 0; // Independent counter for new additions

            const reindexOptions = (optionsContainer, qIndex) => {
                const rows = optionsContainer.querySelectorAll('.option-row');
                rows.forEach((row, idx) => {
                    const radio = row.querySelector('input[type="radio"]');
                    const text = row.querySelector('input[type="text"]');
                    // For new questions, the radio value is simply the index (0, 1, 2, 3)
                    radio.value = idx;
                    // The text input name connects it to the specific new question
                    text.name = `newQuestions[${qIndex}].options[${idx}].text`;
                    text.placeholder = `Option ${idx + 1}`;
                });
            };

            const createOptionRow = (qIndex, oIndex) => {
                const div = document.createElement('div');
                div.className = 'option-row flex items-center space-x-2 mb-2';

                div.innerHTML = `
                    <input type="radio" name="newQuestions[${qIndex}].correctOption" value="${oIndex}" required class="form-radio h-5 w-5 text-blue-600">
                    <input type="text" name="newQuestions[${qIndex}].options[${oIndex}].text" placeholder="Option ${oIndex + 1}" required class="flex-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                    <button type="button" class="text-gray-400 hover:text-red-500 p-1 delete-opt-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                    </button>
                `;

                div.querySelector('.delete-opt-btn').addEventListener('click', () => {
                    if (div.parentElement.querySelectorAll('.option-row').length <= 2) {
                        alert("Minimum 2 options required.");
                        return;
                    }
                    const parent = div.parentElement;
                    div.remove();
                    reindexOptions(parent, qIndex);
                });

                return div;
            };

            btn.addEventListener('click', () => {
                const qIndex = newQuestionCounter++;
                const card = document.createElement('div');
                card.className = 'p-6 bg-blue-50 rounded-lg border border-blue-200 shadow-sm relative';

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold text-blue-800">New Question</h3>
                        <button type="button" class="text-red-500 hover:text-red-700 text-sm font-medium remove-q-btn">Remove</button>
                    </div>

                    <label class="block text-sm font-medium text-gray-700 mb-1">Question Text</label>
                    <textarea name="newQuestions[${qIndex}].text" rows="2" required class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm mb-4"></textarea>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Image (Optional)</label>
                        <input type="file" name="newQuestions[${qIndex}].image" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200">
                    </div>

                    <div class="mt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Options</label>
                        <div class="options-container space-y-2"></div>
                        <button type="button" class="add-opt-btn mt-2 text-sm text-blue-600 hover:text-blue-800 font-medium inline-flex items-center">+ Add Option</button>
                    </div>
                `;

                // Add 4 default options
                const optContainer = card.querySelector('.options-container');
                for(let i=0; i<4; i++) optContainer.appendChild(createOptionRow(qIndex, i));

                // Add Option Button Logic
                card.querySelector('.add-opt-btn').addEventListener('click', () => {
                    const count = optContainer.querySelectorAll('.option-row').length;
                    optContainer.appendChild(createOptionRow(qIndex, count));
                });

                // Remove Question Logic
                card.querySelector('.remove-q-btn').addEventListener('click', () => {
                    card.remove();
                });

                container.appendChild(card);
            });
        });
    </script>
</main>
</body>
</html>
