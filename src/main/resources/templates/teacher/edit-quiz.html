<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Edit Quiz', ~{::main}, 'teacher-dashboard')}">
<head><title>Edit Quiz</title></head>
<body>
<main>
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Edit Quiz</h1>

    <form th:action="@{/teacher/quiz/update/{id}(id=${quiz.id})}" method="post" enctype="multipart/form-data" class="space-y-8 bg-white p-8 rounded-xl shadow-lg">

        <div class="p-6 bg-gray-50 rounded-lg border border-gray-200">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Quiz Details</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Quiz Title</label>
                    <input type="text" name="quizTitle" th:value="${quiz.title}" required class="mt-1 block w-full px-4 py-3 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Subject</label>
                    <input type="text" name="quizSubject" th:value="${quiz.subject}" required class="mt-1 block w-full px-4 py-3 border rounded-lg">
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <div th:each="question, qStat : ${quiz.questions}" class="p-6 bg-white rounded-lg border border-gray-300 shadow-sm">
                <h3 class="text-lg font-semibold text-gray-800 mb-4" th:text="'Question ' + ${qStat.count}">Question 1</h3>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Question Text</label>
                    <textarea th:name="'question_' + ${question.id}" rows="2" required class="mt-1 block w-full px-3 py-2 border rounded-md" th:text="${question.text}"></textarea>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Image</label>

                    <div class="mb-2">
                        <img th:id="'preview-' + ${question.id}"
                             th:src="${question.image != null and question.image.length > 0} ? @{/image/question/{id}(id=${question.id})} : ''"
                             th:class="${question.image != null and question.image.length > 0} ? 'h-32 w-auto rounded border border-gray-200 object-cover' : 'hidden h-32 w-auto rounded border border-gray-200 object-cover'">
                    </div>

                    <input type="file"
                           th:name="'question_' + ${question.id} + '_image'"
                           accept="image/*"
                           th:onchange="'previewEditImage(this, \'preview-' + ${question.id} + '\')'"
                           class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">

                    <p class="text-xs text-gray-400 mt-1">Upload to add or replace image</p>
                </div>

                <div class="space-y-3">
                    <label class="block text-sm font-medium text-gray-700">Options</label>
                    <div th:each="option : ${question.options}" class="flex items-center space-x-3">
                        <input type="radio" th:name="'correct_option_' + ${question.id}" th:value="${option.id}" th:checked="${option.correct}" class="form-radio h-5 w-5 text-blue-600">
                        <input type="text" th:name="'option_' + ${option.id}" th:value="${option.text}" required class="block w-full px-3 py-2 border rounded-md">
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center border-t border-gray-200 pt-6">
            <a th:href="@{/teacher/class/{id}(id=${quiz.classroom.id})}" class="text-gray-600 hover:text-gray-800 font-medium">Cancel</a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg text-lg">Update Quiz</button>
        </div>
    </form>

    <script>
        function previewEditImage(input, imgId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById(imgId);
                    if (img) {
                        img.src = e.target.result;
                        img.classList.remove('hidden');
                    }
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</main>
</body>
</html>
