<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Teacher Dashboard', ~{::main}, 'teacher-dashboard')}">
<head><title>Dashboard</title></head>
<body>
<main>
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">My Classes</h1>
        <a th:href="@{/teacher/class/new}" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">
            + Create New Class
        </a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div th:each="cls : ${classes}" class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-2" th:text="${cls.name}">Math 101</h2>
            <p class="text-gray-500 mb-4">Join Code: <code class="bg-gray-100 px-2 py-1 rounded font-mono text-blue-600" th:text="${cls.code}">ABC12</code></p>
            <a th:href="@{/teacher/class/{id}(id=${cls.id})}" class="text-blue-600 hover:underline font-medium">Manage Class &rarr;</a>
        </div>
    </div>
</main>
</body>
</html>
