<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('My Quizzes', ~{::main}, 'teacher-my-quizzes')}">
<head>
    <title>My Quizzes</title>
</head>
<body>
<main>
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">My Quizzes</h1>
        <a th:href="@{/teacher/quiz/new}" class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg">
            + Create New Quiz
        </a>
    </div>

    <div th:if="${quizzes.isEmpty()}" class="text-center p-6 bg-white rounded-lg shadow-lg">
        <p class="text-gray-600">You have not created any quizzes yet.</p>
    </div>

    <div th:unless="${quizzes.isEmpty()}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div th:each="quiz : ${quizzes}" class="bg-white border border-gray-200 rounded-lg shadow-md p-6 flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-semibold text-gray-800" th:text="${quiz.title}">Quiz Title</h2>
                <p class="text-sm text-gray-500 bg-blue-100 text-blue-800 inline-block px-2 py-0.5 rounded-full mt-2" th:text="${quiz.subject}">Subject</p>
                <p class="text-gray-600 mt-2" th:text="${quiz.questions.size()} + ' Questions'">0 Questions</p>
            </div>
            <div class="mt-4 border-t pt-4 space-x-2">
                <a th:href="@{/teacher/quiz/results/{id}(id=${quiz.id})}" class="text-indigo-600 hover:text-indigo-900 font-medium">View Results</a>
                <a th:href="@{/teacher/quiz/delete/{id}(id=${quiz.id})}"
                   onclick="return confirm('Are you sure you want to delete this quiz?');"
                   class="text-red-600 hover:text-red-900 font-medium">Delete</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
