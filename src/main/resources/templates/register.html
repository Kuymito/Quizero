<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign Up - Quizero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-indigo-600 tracking-tight">Quizero</h1>
        <p class="text-gray-500 mt-2">Create your student account</p>
    </div>

    <div th:if="${error}" class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded-r" role="alert">
        <p class="font-medium">Error</p>
        <p th:text="${error}">Error message</p>
    </div>

    <form th:action="@{/register/save}" th:object="${user}" method="post" class="space-y-5">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
            <input type="text" th:field="*{fullName}" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
                   placeholder="John Doe">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" th:field="*{username}" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
                   placeholder="johndoe">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" th:field="*{password}" id="password" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
                   placeholder="••••••••">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
            <input type="password" name="confirmPassword" id="confirmPassword" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
                   placeholder="••••••••">
        </div>

        <div class="flex items-center">
            <input type="checkbox" id="showPassCheckbox" onclick="togglePasswordVisibility()" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded cursor-pointer">
            <label for="showPassCheckbox" class="ml-2 block text-sm text-gray-700 cursor-pointer">Show Password</label>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow-sm">
            Sign Up
        </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
        Already have an account?
        <a th:href="@{/login}" class="text-indigo-600 hover:text-indigo-800 font-medium hover:underline">Sign In</a>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordField = document.getElementById("password");
        const confirmField = document.getElementById("confirmPassword");
        const checkbox = document.getElementById("showPassCheckbox");

        if (checkbox.checked) {
            passwordField.type = "text";
            confirmField.type = "text";
        } else {
            passwordField.type = "password";
            confirmField.type = "password";
        }
    }
</script>

</body>
</html>
