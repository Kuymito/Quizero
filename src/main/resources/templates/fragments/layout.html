<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:fragment="layout(title, content, activePage)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} + ' - Quiz App'">Quiz App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Smooth transition for sidebar links */
        .nav-item { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

<div class="flex h-screen overflow-hidden">

    <div class="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl z-20">

        <div class="h-16 flex items-center px-6 bg-slate-950 border-b border-slate-800">
            <div class="flex items-center gap-3 text-white">
                <div class="bg-indigo-600 p-1.5 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <span class="text-xl font-bold tracking-tight">Quizero</span>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">

            <div sec:authorize="hasRole('ROLE_ADMIN')">
                <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-2">Administration</p>

                <a th:href="@{/admin/dashboard}"
                   th:classappend="${activePage == 'admin-dashboard'} ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'"
                   class="nav-item group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg">
                    <svg class="mr-3 h-5 w-5 flex-shrink-0" th:classappend="${activePage == 'admin-dashboard'} ? 'text-white' : 'text-slate-400 group-hover:text-white'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    Dashboard
                </a>

                <a th:href="@{/admin/users}"
                   th:classappend="${activePage == 'admin-users'} ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'"
                   class="nav-item group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg">
                    <svg class="mr-3 h-5 w-5 flex-shrink-0" th:classappend="${activePage == 'admin-users'} ? 'text-white' : 'text-slate-400 group-hover:text-white'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    Manage Users
                </a>

                <a th:href="@{/admin/classes}"
                   th:classappend="${activePage == 'admin-classes'} ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'"
                   class="nav-item group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg">
                    <svg class="mr-3 h-5 w-5 flex-shrink-0" th:classappend="${activePage == 'admin-classes'} ? 'text-white' : 'text-slate-400 group-hover:text-white'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                    Manage Classes
                </a>

                <a th:href="@{/admin/quizzes}"
                   th:classappend="${activePage == 'admin-quizzes'} ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'"
                   class="nav-item group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg">
                    <svg class="mr-3 h-5 w-5 flex-shrink-0" th:classappend="${activePage == 'admin-quizzes'} ? 'text-white' : 'text-slate-400 group-hover:text-white'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    Manage Quizzes
                </a>
            </div>

            <div sec:authorize="hasRole('ROLE_TEACHER')">
                <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-2">Teaching</p>

                <a th:href="@{/teacher/dashboard}"
                   th:classappend="${activePage == 'teacher-dashboard'} ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'"
                   class="nav-item group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg">
                    <svg class="mr-3 h-5 w-5 flex-shrink-0" th:classappend="${activePage == 'teacher-dashboard'} ? 'text-white' : 'text-slate-400 group-hover:text-white'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 13v-1m4 1v-3m4 3V8M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" />
                    </svg>
                    My Classes
                </a>

                <a th:href="@{/teacher/class/new}"
                   th:classappend="${activePage == 'teacher-create-class'} ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'"
                   class="nav-item group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg">
                    <svg class="mr-3 h-5 w-5 flex-shrink-0" th:classappend="${activePage == 'teacher-create-class'} ? 'text-white' : 'text-slate-400 group-hover:text-white'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Create New Class
                </a>
            </div>

            <div sec:authorize="hasRole('ROLE_STUDENT')">
                <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-2">Learning</p>

                <a th:href="@{/student/dashboard}"
                   th:classappend="${activePage == 'student-dashboard'} ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'"
                   class="nav-item group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg">
                    <svg class="mr-3 h-5 w-5 flex-shrink-0" th:classappend="${activePage == 'student-dashboard'} ? 'text-white' : 'text-slate-400 group-hover:text-white'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    My Classes
                </a>

                <a th:href="@{/student/join}"
                   th:classappend="${activePage == 'student-join'} ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'"
                   class="nav-item group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg">
                    <svg class="mr-3 h-5 w-5 flex-shrink-0" th:classappend="${activePage == 'student-join'} ? 'text-white' : 'text-slate-400 group-hover:text-white'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
                    </svg>
                    Join Class
                </a>

                <a th:href="@{/student/performance}"
                   th:classappend="${activePage == 'student-performance'} ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'"
                   class="nav-item group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg">
                    <svg class="mr-3 h-5 w-5 flex-shrink-0" th:classappend="${activePage == 'student-performance'} ? 'text-white' : 'text-slate-400 group-hover:text-white'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
                    </svg>
                    My Performance
                </a>

                <a th:href="@{/student/leaderboard}"
                   th:classappend="${activePage == 'student-leaderboard'} ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'"
                   class="nav-item group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg">
                    <svg class="mr-3 h-5 w-5 flex-shrink-0" th:classappend="${activePage == 'student-leaderboard'} ? 'text-white' : 'text-slate-400 group-hover:text-white'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    Leaderboard
                </a>
            </div>

        </nav>

        <div class="p-4 bg-slate-950 border-t border-slate-800">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold text-sm border border-slate-600 shadow-sm">
                    <span sec:authentication="name" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-white truncate" sec:authentication="name">User</p>
                    <p class="text-xs text-slate-500 truncate" sec:authentication="principal.authorities[0]">Role</p>
                </div>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="w-full flex items-center justify-center px-4 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider bg-slate-800 hover:bg-slate-700 hover:text-white rounded-lg transition-colors border border-slate-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Sign Out
                </button>
            </form>
        </div>
    </div>

    <div class="flex-1 flex flex-col overflow-hidden bg-gray-50">
        <header class="bg-white shadow-sm border-b border-gray-200 p-4 lg:px-8 flex justify-between items-center h-16 z-10">
            <h1 class="text-xl font-bold text-gray-800 tracking-tight" th:text="${title}">Page Title</h1>
            <div class="flex items-center space-x-2 text-sm text-gray-500">
                <span>Logged in as:</span>
                <span class="font-medium text-gray-900 bg-gray-100 px-2 py-1 rounded" sec:authentication="name">User</span>
            </div>
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto p-6 md:p-8 scroll-smooth">
            <div class="max-w-6xl mx-auto">
                <div th:if="${success}" class="mb-6 p-4 rounded-lg bg-green-50 border border-green-200 text-green-700 flex items-center shadow-sm">
                    <svg class="h-5 w-5 mr-2 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                    <strong th:text="${success}"></strong>
                </div>
                <div th:if="${error}" class="mb-6 p-4 rounded-lg bg-red-50 border border-red-200 text-red-700 flex items-center shadow-sm">
                    <svg class="h-5 w-5 mr-2 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                    <strong th:text="${error}"></strong>
                </div>

                <div th:replace="${content}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
