<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quiz App Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="w-full max-w-md p-8 bg-white rounded-xl shadow-lg">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Quiz App Login</h2>

    <!-- Display error message if login failed -->
    <div th:if="${param.error}" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-center">
        Invalid username or password.
    </div>

    <!-- Display logout message -->
    <div th:if="${param.logout}" class="mb-4 p-3 bg-blue-100 text-blue-700 rounded-lg text-center">
        You have been logged out.
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post" class="space-y-6">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
            <input type="text" id="username" name="username" required
                   class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="password" name="password" required
                   class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>

        <button type="submit"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Sign in
        </button>
    </form>

    <div class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
        <h4 class="font-medium text-gray-700">Test Users (password: <code class="bg-gray-200 px-1 rounded">password123</code>)</h4>
        <ul class="list-disc list-inside text-sm text-gray-600 mt-2">
            <li><code class="font-medium">admin</code> (Admin Role)</li>
            <li><code class="font-medium">teacher</code> (Teacher Role)</li>
            <li><code class="font-medium">student</code> (Student Role)</li>
        </ul>
    </div>
</div>

</body>
</html>
