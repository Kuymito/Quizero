<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Create User', ~{::main}, 'admin-users')}">
<head><title>Create User</title></head>
<body>
<main class="max-w-2xl mx-auto">
  <div class="flex items-center mb-6">
    <a th:href="@{/admin/users}" class="mr-4 p-2 bg-white rounded-full text-gray-500 hover:text-gray-800 shadow-sm border border-gray-200">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
      </svg>
    </a>
    <h1 class="text-3xl font-bold text-gray-800">Create New User</h1>
  </div>

  <form th:action="@{/admin/users/create}" method="post" class="bg-white p-8 rounded-xl shadow-lg border border-gray-200 space-y-6">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="col-span-1 md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input type="text" name="fullName" required placeholder="e.g. John Doe"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" name="username" required placeholder="e.g. johndoe"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
        <select name="role" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
          <option value="ROLE_STUDENT">Student</option>
          <option value="ROLE_TEACHER">Teacher</option>
          <option value="ROLE_ADMIN">Admin</option>
        </select>
      </div>

      <div class="col-span-1 md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        <p class="text-xs text-gray-500 mt-1">Must be at least 6 characters long.</p>
      </div>
    </div>

    <div class="pt-4 flex justify-end space-x-3 border-t border-gray-100">
      <a th:href="@{/admin/users}" class="px-6 py-2.5 text-gray-700 font-medium hover:bg-gray-100 rounded-lg transition-colors">Cancel</a>
      <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-8 rounded-lg shadow-md transition-colors">
        Create User
      </button>
    </div>
  </form>
</main>
</body>
</html>
