<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Edit Class', ~{::main}, 'admin-classes')}">
<head><title>Edit Class</title></head>
<body>
<main class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Edit Class</h1>
  <form th:action="@{/admin/class/update/{id}(id=${classroom.id})}" method="post" class="space-y-4">
    <div>
      <label class="block text-gray-700 font-bold mb-2">Class Name</label>
      <input type="text" name="name" th:value="${classroom.name}" required class="w-full px-4 py-2 border rounded-lg">
    </div>
    <div class="pt-4 flex justify-end space-x-3">
      <a th:href="@{/admin/classes}" class="px-4 py-2 text-gray-600 hover:text-gray-800">Cancel</a>
      <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-lg">Update</button>
    </div>
  </form>
</main>
</body>
</html>
