<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Manage Classes', ~{::main}, 'admin-classes')}">
<body>
<main>
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-gray-800">Manage Classes</h1>
        <a th:href="@{/admin/class/new}" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-6 rounded-lg shadow-sm transition-colors">
            + Create New Class
        </a>
    </div>

    <form th:action="@{/admin/classes}" method="get" class="mb-6 flex gap-3">
        <input type="text" name="search" th:value="${search}" placeholder="Search classes..." class="flex-1 px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none">
        <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2.5 rounded-lg shadow-sm transition-colors">Search</button>
    </form>

    <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">
                    <a th:href="@{/admin/classes(page=${currentPage}, sortField='id', sortDir=${reverseSortDir}, search=${search})}" class="hover:text-gray-700 flex items-center">
                        ID <span th:if="${sortField == 'id'}" th:text="${sortDir == 'asc' ? ' ▲' : ' ▼'}"></span>
                    </a>
                </th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">
                    <a th:href="@{/admin/classes(page=${currentPage}, sortField='name', sortDir=${reverseSortDir}, search=${search})}" class="hover:text-gray-700 flex items-center">
                        Class Name <span th:if="${sortField == 'name'}" th:text="${sortDir == 'asc' ? ' ▲' : ' ▼'}"></span>
                    </a>
                </th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">
                    <a th:href="@{/admin/classes(page=${currentPage}, sortField='code', sortDir=${reverseSortDir}, search=${search})}" class="hover:text-gray-700 flex items-center">
                        Code <span th:if="${sortField == 'code'}" th:text="${sortDir == 'asc' ? ' ▲' : ' ▼'}"></span>
                    </a>
                </th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">
                    <a th:href="@{/admin/classes(page=${currentPage}, sortField='teacher.fullName', sortDir=${reverseSortDir}, search=${search})}" class="hover:text-gray-700 flex items-center">
                        Teacher <span th:if="${sortField == 'teacher.fullName'}" th:text="${sortDir == 'asc' ? ' ▲' : ' ▼'}"></span>
                    </a>
                </th>
                <th class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase">Actions</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="cls : ${classes}">
                <td class="px-6 py-4 text-sm text-gray-500" th:text="${cls.id}">1</td>
                <td class="px-6 py-4 font-medium text-gray-900" th:text="${cls.name}">Name</td>
                <td class="px-6 py-4 text-sm text-gray-500 font-mono" th:text="${cls.code}">Code</td>
                <td class="px-6 py-4 text-sm text-gray-500" th:text="${cls.teacher.fullName}">Teacher</td>

                <td class="px-6 py-4 text-right text-sm font-medium flex justify-end space-x-3">
                    <a th:href="@{/admin/quizzes(classId=${cls.id})}" class="text-blue-600 hover:text-blue-900 mr-2 flex items-center" title="View Quizzes">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                    </a>

                    <a th:href="@{/admin/class/edit/{id}(id=${cls.id})}" class="text-indigo-600 hover:text-indigo-900" title="Edit">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                        </svg>
                    </a>

                    <a th:href="@{/admin/class/delete/{id}(id=${cls.id})}" onclick="return confirm('Delete this class? This will delete all quizzes inside it.');" class="text-red-600 hover:text-red-900" title="Delete">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${totalPages > 1}" class="mt-6 flex justify-center items-center space-x-2">
        <a th:href="@{/admin/classes(page=${currentPage - 1}, search=${search}, sortField=${sortField}, sortDir=${sortDir})}"
           class="px-4 py-2 border rounded-lg bg-white hover:bg-gray-50" th:classappend="${currentPage == 0} ? 'pointer-events-none opacity-50'">Previous</a>
        <span class="px-4 py-2 text-gray-700">Page <span th:text="${currentPage + 1}"></span> of <span th:text="${totalPages}"></span></span>
        <a th:href="@{/admin/classes(page=${currentPage + 1}, search=${search}, sortField=${sortField}, sortDir=${sortDir})}"
           class="px-4 py-2 border rounded-lg bg-white hover:bg-gray-50" th:classappend="${currentPage == totalPages - 1} ? 'pointer-events-none opacity-50'">Next</a>
    </div>
</main>
</body>
</html>
