<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Edit Quiz', ~{::main}, 'admin-quizzes')}">
<head><title>Edit Quiz</title></head>
<body>
<main>
    <div class="flex items-center mb-6">
        <a th:href="@{/admin/quizzes}" class="mr-4 p-2 bg-white rounded-full text-gray-500 hover:text-gray-800 shadow-sm border border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" /></svg>
        </a>
        <h1 class="text-3xl font-bold text-gray-800">Edit Quiz</h1>
    </div>

    <form th:action="@{/admin/quiz/update/{id}(id=${quiz.id})}" method="post" class="space-y-8 max-w-4xl mx-auto">

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                    <input type="text" name="quizTitle" th:value="${quiz.title}" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                    <input type="text" name="subject" th:value="${quiz.subject}" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
        </div>

        <div th:each="question, qStat : ${quiz.questions}" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h3 class="text-lg font-semibold text-gray-800 mb-4" th:text="'Question ' + ${qStat.count}">Question 1</h3>

            <div class="mb-4">
                <textarea th:name="'question_' + ${question.id}" rows="2" required
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                          th:text="${question.text}"></textarea>
            </div>

            <div class="space-y-3">
                <p class="text-sm font-medium text-gray-700">Options (Check all correct answers)</p>
                <div th:each="option : ${question.options}" class="flex items-center gap-3">

                    <input type="checkbox"
                           th:name="'correct_option_' + ${option.id}"
                           th:checked="${option.correct}"
                           class="h-5 w-5 text-blue-600 focus:ring-blue-500 border-gray-300 rounded cursor-pointer">

                    <input type="text" th:name="'option_' + ${option.id}" th:value="${option.text}" required
                           class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>
            </div>
        </div>

        <div class="sticky bottom-4 bg-white p-4 rounded-xl shadow-lg border border-gray-200 flex justify-end">
            <button type="submit" class="px-8 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm transition-colors">
                Save Changes
            </button>
        </div>
    </form>
</main>
</body>
</html>
