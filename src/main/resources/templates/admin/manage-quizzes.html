<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'admin-quizzes')}">
<head>
    <title>Manage Quizzes</title>
</head>
<body>
<main>
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Manage All Quizzes</h1>
    <div class="bg-white rounded-xl shadow-lg overflow-x-auto border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Subject</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created by (Teacher)</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="quiz : ${quizzes}">
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${quiz.id}">1</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${quiz.title}">Java Basics</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${quiz.subject}">Programming</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${quiz.teacher.fullName}">Teacher User</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                    <a th:href="@{/admin/quiz/delete/{id}(id=${quiz.id})}"
                       onclick="return confirm('Are you sure you want to delete this quiz? This is irreversible.');"
                       class="text-red-600 hover:text-red-900">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
