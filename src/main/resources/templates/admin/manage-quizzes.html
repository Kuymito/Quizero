<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Manage Quizzes', ~{::main}, 'admin-quizzes')}">
<body>
<main>
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-gray-800">Manage All Quizzes</h1>
        <a th:href="@{/admin/quiz/new}" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-6 rounded-lg shadow-sm flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Create New Quiz
        </a>
    </div>

    <form th:action="@{/admin/quizzes}" method="get" id="searchForm" class="mb-6 flex gap-3 items-center">
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="sortField" th:value="${sortField}">
        <input type="hidden" name="sortDir" th:value="${sortDir}">

        <select name="size" onchange="document.getElementById('searchForm').submit()"
                class="border border-gray-300 rounded-lg py-2.5 px-3 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="10" th:selected="${size == 10}">10</option>
            <option value="20" th:selected="${size == 20}">20</option>
            <option value="50" th:selected="${size == 50}">50</option>
        </select>

        <input type="text" name="search" th:value="${search}" placeholder="Search quizzes..." class="flex-1 px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg shadow-sm transition-colors">Search</button>
    </form>

    <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">ID</th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Title</th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Subject</th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Class</th>
                <th class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase">Actions</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="quiz : ${quizzes}">
                <td class="px-6 py-4 text-sm text-gray-500" th:text="${quiz.id}">1</td>
                <td class="px-6 py-4 font-medium text-gray-900" th:text="${quiz.title}">Title</td>
                <td class="px-6 py-4 text-sm text-gray-500" th:text="${quiz.subject}">Sub</td>
                <td class="px-6 py-4 text-sm text-gray-500" th:text="${quiz.classroom.name}">Class</td>

                <td class="px-6 py-4 text-right text-sm font-medium flex justify-end space-x-3">
                    <a th:href="@{/admin/quiz/edit/{id}(id=${quiz.id})}" class="text-indigo-600 hover:text-indigo-900" title="Edit">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                        </svg>
                    </a>
                    <a th:href="@{/admin/quiz/delete/{id}(id=${quiz.id})}" onclick="return confirm('Delete?')" class="text-red-600 hover:text-red-900" title="Delete">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${totalPages > 1}" class="mt-6 flex justify-center items-center space-x-2">
        <a th:href="@{/admin/quizzes(page=${currentPage - 1}, size=${size}, search=${search}, sortField=${sortField}, sortDir=${sortDir})}"
           class="px-4 py-2 border rounded-lg bg-white hover:bg-gray-50" th:classappend="${currentPage == 0} ? 'pointer-events-none opacity-50'">Previous</a>
        <span class="px-4 py-2 text-gray-700">Page <span th:text="${currentPage + 1}"></span> of <span th:text="${totalPages}"></span></span>
        <a th:href="@{/admin/quizzes(page=${currentPage + 1}, size=${size}, search=${search}, sortField=${sortField}, sortDir=${sortDir})}"
           class="px-4 py-2 border rounded-lg bg-white hover:bg-gray-50" th:classappend="${currentPage == totalPages - 1} ? 'pointer-events-none opacity-50'">Next</a>
    </div>
</main>
</body>
</html>
