<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Create Quiz', ~{::main}, 'admin-quizzes')}">
<head><title>Create Quiz</title></head>
<body>
<main>
    <div class="flex items-center mb-6">
        <a th:href="@{/admin/quizzes}" class="mr-4 p-2 bg-white rounded-full text-gray-500 hover:text-gray-800 shadow-sm border border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
        </a>
        <h1 class="text-3xl font-bold text-gray-800">Create New Quiz</h1>
    </div>

    <form th:action="@{/admin/quiz/create}" method="post" enctype="multipart/form-data" id="quizForm" class="space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-200">

        <div class="p-6 bg-gray-50 rounded-lg border border-gray-200">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Quiz Settings</h2>
            <div class="grid grid-cols-1 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Assign to Class</label>
                    <select name="classId" required class="block w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 bg-white">
                        <option value="" disabled selected>Select a class...</option>
                        <option th:each="cls : ${classes}"
                                th:value="${cls.id}"
                                th:text="${cls.name} + ' (Teacher: ' + ${cls.teacher.fullName} + ')'"></option>
                    </select>
                    <p class="text-xs text-gray-500 mt-1">The quiz subject will automatically match the class name.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Quiz Title</label>
                    <input type="text" name="title" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
                </div>
            </div>
        </div>

        <div id="questionsContainer" class="space-y-6"></div>

        <div class="flex justify-between items-center border-t border-gray-200 pt-6">
            <button type="button" id="addQuestionBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                + Add Question
            </button>
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg text-lg shadow-md transition-colors">
                Save Quiz
            </button>
        </div>
    </form>

    <script>
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const container = input.closest('.image-container');
                    const img = container.querySelector('img');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const questionsContainer = document.getElementById('questionsContainer');
            const addQuestionBtn = document.getElementById('addQuestionBtn');
            let questionIndex = 0;

            // Helper to re-index options after deletion so backend loop doesn't break
            const reindexOptions = (container, qIndex) => {
                const rows = container.querySelectorAll('.option-row');
                rows.forEach((row, index) => {
                    const radio = row.querySelector('input[type="radio"]');
                    const textInput = row.querySelector('input[type="text"]');

                    radio.value = index;
                    // Important: Backend expects sequential array indices
                    textInput.name = `questions[${qIndex}].options[${index}].text`;
                    textInput.placeholder = `Option ${index + 1}`;
                });
            };

            const createOptionNode = (qIndex, oIndex) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option-row flex items-center space-x-2 mb-2';

                // Radio Button (Correct Answer)
                const radioInput = document.createElement('input');
                radioInput.type = 'radio';
                radioInput.name = `questions[${qIndex}].correctOption`;
                radioInput.value = oIndex;
                radioInput.required = true;
                radioInput.className = 'form-radio h-5 w-5 text-blue-600 focus:ring-blue-500';

                // Text Input
                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.name = `questions[${qIndex}].options[${oIndex}].text`;
                textInput.placeholder = `Option ${oIndex + 1}`;
                textInput.required = true;
                textInput.className = 'flex-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500';

                // Delete Button (Trash Icon)
                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'text-gray-400 hover:text-red-500 transition-colors p-1';
                deleteBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>`;

                deleteBtn.onclick = function() {
                    const container = optionDiv.parentElement;
                    // Prevent deleting if only 2 options left
                    if(container.querySelectorAll('.option-row').length <= 2) {
                        alert("A question must have at least 2 options.");
                        return;
                    }
                    optionDiv.remove();
                    reindexOptions(container, qIndex);
                };

                optionDiv.appendChild(radioInput);
                optionDiv.appendChild(textInput);
                optionDiv.appendChild(deleteBtn);

                return optionDiv;
            };

            const addQuestion = () => {
                const qIndex = questionIndex++;
                const questionBlock = document.createElement('div');
                questionBlock.className = 'question-block p-6 bg-white rounded-lg border border-gray-300 shadow-sm';

                let innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold text-gray-800">Question ${qIndex + 1}</h3>
                        <button type="button" class="text-red-500 hover:text-red-700 text-sm font-medium" onclick="this.closest('.question-block').remove()">Remove Question</button>
                    </div>

                    <label class="block text-sm font-medium text-gray-700 mb-1">Question Text</label>
                    <textarea name="questions[${qIndex}].text" rows="2" required class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 mb-4"></textarea>

                    <div class="mb-4 image-container">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Image (Optional)</label>
                        <img src="" alt="Preview" class="hidden h-32 w-auto rounded border border-gray-200 object-cover mb-2">
                        <input type="file" name="questions[${qIndex}].image" accept="image/*" onchange="previewImage(this)"
                               class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>

                    <div class="mt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Options</label>
                        <div class="options-container space-y-2"></div>
                        <button type="button" class="add-option-btn mt-2 text-sm text-blue-600 hover:text-blue-800 font-medium inline-flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                            Add Option
                        </button>
                    </div>
                `;

                questionBlock.innerHTML = innerHTML;
                const optionsContainer = questionBlock.querySelector('.options-container');

                // Add initial options
                for (let i = 0; i < 4; i++) {
                    optionsContainer.appendChild(createOptionNode(qIndex, i));
                }

                // Handle "Add Option" button click
                questionBlock.querySelector('.add-option-btn').addEventListener('click', () => {
                    const currentCount = optionsContainer.querySelectorAll('.option-row').length;
                    optionsContainer.appendChild(createOptionNode(qIndex, currentCount));
                });

                questionsContainer.appendChild(questionBlock);
            };

            addQuestion();
            addQuestionBtn.addEventListener('click', addQuestion);
        });
    </script>
</main>
</body>
</html>
