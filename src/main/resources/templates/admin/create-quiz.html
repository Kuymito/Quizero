<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Create Quiz', ~{::main}, 'admin-quizzes')}">
<head><title>Create Quiz</title></head>
<body>
<main>
    <div class="flex items-center mb-6">
        <a th:href="@{/admin/quizzes}" class="mr-4 p-2 bg-white rounded-full text-gray-500 hover:text-gray-800 shadow-sm border border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" /></svg>
        </a>
        <h1 class="text-3xl font-bold text-gray-800">Create New Quiz</h1>
    </div>

    <form th:action="@{/admin/quiz/create}" method="post" class="space-y-8 max-w-5xl mx-auto">

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                <input type="text" name="title" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                <input type="text" name="subject" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Assign to Class</label>
                <select name="classroomId" class="w-full px-4 py-2 border rounded-lg bg-white">
                    <option th:each="classroom : ${classrooms}" th:value="${classroom.id}" th:text="${classroom.name}"></option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Teacher Owner</label>
                <select name="teacherId" class="w-full px-4 py-2 border rounded-lg bg-white">
                    <option th:each="teacher : ${teachers}" th:value="${teacher.id}" th:text="${teacher.fullName}"></option>
                </select>
            </div>
        </div>

        <div th:each="i : ${#numbers.sequence(1, 5)}" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h3 class="text-lg font-bold text-gray-800 mb-4" th:text="'Question ' + ${i}">Question 1</h3>

            <div class="mb-4">
                <input type="text" th:name="'question_text_' + ${i}" placeholder="Enter question text..."
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div th:each="j : ${#numbers.sequence(1, 4)}" class="flex items-center gap-2">
                    <input type="checkbox"
                           th:name="'q' + ${i} + '_option_' + ${j} + '_correct'"
                           class="h-5 w-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer">

                    <input type="text" th:name="'q' + ${i} + '_option_' + ${j}" th:placeholder="'Option ' + ${j}"
                           class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>
            </div>
        </div>

        <div class="sticky bottom-4 bg-white p-4 rounded-xl shadow-lg border border-gray-200 flex justify-end">
            <button type="submit" class="px-8 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm transition-colors">
                Create Quiz
            </button>
        </div>
    </form>
</main>
</body>
</html>
