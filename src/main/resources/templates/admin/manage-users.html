<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{fragments/layout :: layout('Manage Users', ~{::main}, 'admin-users')}">
<head><title>Manage Users</title></head>
<body>
<main>
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Manage Users</h1>

    <form th:action="@{/admin/users}" method="get" class="mb-6 flex gap-3">
        <input type="text" name="search" th:value="${search}" placeholder="Search users..." class="flex-1 px-4 py-2 border rounded-lg">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg">Search</button>
        <a th:if="${search}" th:href="@{/admin/users}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded-lg flex items-center">Clear</a>
    </form>

    <div class="bg-white rounded-xl shadow-lg overflow-x-auto border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">ID</th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Full Name</th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Username</th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Role</th>
                <th class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase">Actions</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="user : ${users}">
                <td class="px-6 py-4 text-sm text-gray-900" th:text="${user.id}">1</td>
                <td class="px-6 py-4 text-sm text-gray-900" th:text="${user.fullName}">Name</td>
                <td class="px-6 py-4 text-sm text-gray-500" th:text="${user.username}">User</td>
                <td class="px-6 py-4 text-sm text-gray-500">
                    <span class="px-2 py-1 rounded text-xs font-semibold"
                          th:classappend="${user.role.name() == 'ROLE_ADMIN'} ? 'bg-red-100 text-red-800' : (${user.role.name() == 'ROLE_TEACHER'} ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800')"
                          th:text="${user.role.name()}">ROLE</span>
                </td>
                <td class="px-6 py-4 text-right text-sm font-medium flex justify-end space-x-3">
                    <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="text-indigo-600 hover:text-indigo-900" title="Edit">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                        </svg>
                    </a>
                    <span th:if="${user.username == #authentication.name}" class="text-gray-400 cursor-not-allowed" title="Cannot delete self">
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </span>
                    <a th:unless="${user.username == #authentication.name}"
                       th:href="@{/admin/users/delete/{id}(id=${user.id})}"
                       onclick="return confirm('Delete this user?');"
                       class="text-red-600 hover:text-red-900" title="Delete">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
