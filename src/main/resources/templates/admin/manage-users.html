<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Manage Users', ~{::main}, 'admin-users')}">
<body>
<main>
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-gray-800">Manage Users</h1>
        <a th:href="@{/admin/users/new}" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-6 rounded-lg shadow-sm transition-colors">Create New User</a>
    </div>

    <form th:action="@{/admin/users}" method="get" id="searchForm" class="mb-6 flex gap-3 items-center">
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="sortField" th:value="${sortField}">
        <input type="hidden" name="sortDir" th:value="${sortDir}">

        <select name="size" onchange="document.getElementById('searchForm').submit()"
                class="border border-gray-300 rounded-lg py-2.5 px-3 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="10" th:selected="${size == 10}">10</option>
            <option value="20" th:selected="${size == 20}">20</option>
            <option value="50" th:selected="${size == 50}">50</option>
        </select>

        <input type="text" name="search" th:value="${search}" placeholder="Search..." class="flex-1 px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg shadow-sm transition-colors">Search</button>
    </form>

    <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <a th:href="@{/admin/users(page=${currentPage}, size=${size}, sortField='id', sortDir=${reverseSortDir}, search=${search})}" class="flex items-center hover:text-gray-700">
                        ID <span th:if="${sortField == 'id'}" th:text="${sortDir == 'asc' ? ' ▲' : ' ▼'}"></span>
                    </a>
                </th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <a th:href="@{/admin/users(page=${currentPage}, size=${size}, sortField='fullName', sortDir=${reverseSortDir}, search=${search})}" class="flex items-center hover:text-gray-700">
                        Full Name <span th:if="${sortField == 'fullName'}" th:text="${sortDir == 'asc' ? ' ▲' : ' ▼'}"></span>
                    </a>
                </th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <a th:href="@{/admin/users(page=${currentPage}, size=${size}, sortField='username', sortDir=${reverseSortDir}, search=${search})}" class="flex items-center hover:text-gray-700">
                        Username <span th:if="${sortField == 'username'}" th:text="${sortDir == 'asc' ? ' ▲' : ' ▼'}"></span>
                    </a>
                </th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <a th:href="@{/admin/users(page=${currentPage}, size=${size}, sortField='role', sortDir=${reverseSortDir}, search=${search})}" class="flex items-center hover:text-gray-700">
                        Role <span th:if="${sortField == 'role'}" th:text="${sortDir == 'asc' ? ' ▲' : ' ▼'}"></span>
                    </a>
                </th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <a th:href="@{/admin/users(page=${currentPage}, size=${size}, sortField='enabled', sortDir=${reverseSortDir}, search=${search})}" class="flex items-center hover:text-gray-700">
                        Status <span th:if="${sortField == 'enabled'}" th:text="${sortDir == 'asc' ? ' ▲' : ' ▼'}"></span>
                    </a>
                </th>
                <th class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="user : ${users}" th:classappend="${!user.enabled} ? 'bg-gray-50 opacity-75' : 'hover:bg-gray-50'">
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${user.id}">1</td>
                <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900" th:text="${user.fullName}">Name</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${user.username}">user</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm"><span th:text="${user.role}">ROLE</span></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm"><span th:text="${user.enabled} ? 'Active' : 'Disabled'">Active</span></td>

                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium flex justify-end space-x-3">
                    <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="text-indigo-600 hover:text-indigo-900" title="Edit">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                        </svg>
                    </a>
                    <a th:if="${user.enabled and user.username != #authentication.name}"
                       th:href="@{/admin/users/delete/{id}(id=${user.id})}"
                       onclick="return confirm('Disable this user?');"
                       class="text-red-600 hover:text-red-900" title="Disable User">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${totalPages > 1}" class="mt-6 flex justify-center items-center space-x-2">
        <a th:href="@{/admin/users(page=${currentPage - 1}, size=${size}, search=${search}, sortField=${sortField}, sortDir=${sortDir})}"
           class="px-4 py-2 border rounded-lg text-gray-600 bg-white hover:bg-gray-50"
           th:classappend="${currentPage == 0} ? 'pointer-events-none opacity-50'">Previous</a>
        <span class="px-4 py-2 text-gray-700">Page <span th:text="${currentPage + 1}"></span> of <span th:text="${totalPages}"></span></span>
        <a th:href="@{/admin/users(page=${currentPage + 1}, size=${size}, search=${search}, sortField=${sortField}, sortDir=${sortDir})}"
           class="px-4 py-2 border rounded-lg text-gray-600 bg-white hover:bg-gray-50"
           th:classappend="${currentPage == totalPages - 1} ? 'pointer-events-none opacity-50'">Next</a>
    </div>
</main>
</body>
</html>
