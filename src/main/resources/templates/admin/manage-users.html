<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'admin-users')}">
<head>
    <title>Manage Users</title>
</head>
<body>
<main>
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Manage Users</h1>
    <div class="bg-white rounded-xl shadow-lg overflow-x-auto border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Full Name</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="user : ${users}">
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${user.id}">1</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${user.fullName}">Admin User</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${user.username}">admin</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${user.role.name()}">ROLE_ADMIN</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                    <span th:if="${user.username == #authentication.name}" class="text-gray-400">Cannot Delete Self</span>
                    <a th:unless="${user.username == #authentication.name}"
                       th:href="@{/admin/users/delete/{id}(id=${user.id})}"
                       onclick="return confirm('Are you sure you want to delete this user? This is irreversible.');"
                       class="text-red-600 hover:text-red-900 ml-4">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
