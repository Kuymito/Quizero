<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Edit User', ~{::main}, 'admin-users')}">
<head><title>Edit User</title></head>
<body>
<main class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Edit User</h1>
    <form th:action="@{/admin/users/update/{id}(id=${user.id})}" method="post" class="space-y-4">
        <div>
            <label class="block text-gray-700 font-bold mb-2">Full Name</label>
            <input type="text" name="fullName" th:value="${user.fullName}" required class="w-full px-4 py-2 border rounded-lg">
        </div>
        <div>
            <label class="block text-gray-700 font-bold mb-2">Username</label>
            <input type="text" name="username" th:value="${user.username}" required class="w-full px-4 py-2 border rounded-lg">
        </div>
        <div>
            <label class="block text-gray-700 font-bold mb-2">Role</label>
            <select name="role" class="w-full px-4 py-2 border rounded-lg bg-white">
                <option value="ROLE_ADMIN" th:selected="${user.role.name() == 'ROLE_ADMIN'}">Admin</option>
                <option value="ROLE_TEACHER" th:selected="${user.role.name() == 'ROLE_TEACHER'}">Teacher</option>
                <option value="ROLE_STUDENT" th:selected="${user.role.name() == 'ROLE_STUDENT'}">Student</option>
            </select>
        </div>
        <div class="pt-4 flex justify-end space-x-3">
            <a th:href="@{/admin/users}" class="px-4 py-2 text-gray-600 hover:text-gray-800">Cancel</a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">Update</button>
        </div>
    </form>
</main>
</body>
</html>
